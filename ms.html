<h2 style="font-size:24px;">黄梅戏</h2>
<p style="font-size:20px;line-height:2;">
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;黄梅戏是安徽最具代表性的地方戏曲，也是中国五大戏曲剧种之一，唱腔淳朴流畅，表演质朴细腻，以抒情见长，具有丰富的表现力。
<br><br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;黄梅戏起源于湖北黄梅，发展壮大于安徽安庆，经典剧目有《天仙配》《女驸马》等，深受全国人民喜爱，是安徽民俗文化中最耀眼的瑰宝，承载着千年的地域文化与风土人情。
</p>
